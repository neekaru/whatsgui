name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-build:
    name: Windows CI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup, verify, and test
        uses: ./.github/actions/setup-and-verify

      - name: Build Windows app
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: bun run build -- -platform windows/amd64

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: whatsgui-windows-amd64
          path: build/windows-amd64/*
          if-no-files-found: error
