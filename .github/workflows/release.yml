name: Release

on:
  push:
    tags: ["[0-9]*", "v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Comma-separated GOOS/GOARCH targets"
        required: false
        default: "windows/amd64,windows/arm64"
      version:
        description: "Optional version override (e.g. 0.1.1)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build & Release (${{ inputs.platform || 'windows/amd64,windows/arm64' }})
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup, verify, and test
        uses: ./.github/actions/setup-and-verify

      - name: Build Windows installers and binaries
        shell: bash
        env:
          CGO_ENABLED: "0"
          APP_VERSION: ${{ inputs.version }}
          MYGO_UPDATER_PUBLIC_KEY: ${{ secrets.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build -- -platform "${{ inputs.platform || 'windows/amd64,windows/arm64' }}"

      - name: Package portable archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Get-ChildItem -Path build -Directory -Filter "windows-*" | ForEach-Object {
            $target = $_.Name
            $zipPath = Join-Path "dist-release" "whatsgui-$target.zip"
            $files = Get-ChildItem -Path $_.FullName -File | Where-Object {
              $_.Name -notlike "*-setup-*.exe" -and
              $_.Name -ne ".mygo-files" -and
              $_.Name -notlike "update-*.json" -and
              $_.Name -notlike "*.tar.gz" -and
              $_.Name -ne "install.ps1"
            }
            if ($files) {
              Compress-Archive -Path $files.FullName -DestinationPath $zipPath -Force
            }
            Get-ChildItem -Path $_.FullName -File | Where-Object {
              $_.Name -like "*-setup-*.exe" -or
              $_.Name -like "update-*.json" -or
              $_.Name -like "*.tar.gz" -or
              $_.Name -eq "install.ps1"
            } | Copy-Item -Destination dist-release -Force
          }
          if (Test-Path "build/checksums.txt") {
            Copy-Item "build/checksums.txt" -Destination dist-release -Force
          }
          Get-ChildItem dist-release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: whatsgui-release
          path: dist-release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
